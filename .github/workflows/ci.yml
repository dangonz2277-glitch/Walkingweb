name: CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-test:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v7

    - name: Use Node.js
      uses: actions/setup-node@v7
      with:
        node-version: '22.12.0'
        cache: 'npm'

    - name: Install dependencies
      run: npm ci

    - name: Build project (Strict mode)
      run: npm run build
      env:
        NEXT_PUBLIC_SUPABASE_URL: https://test-project.supabase.co
        NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: test-publishable-key-1234567890-not-for-prod
        SUPABASE_SECRET_KEY: test-secret-key-1234567890-not-for-prod

    - name: Run linter
      run: npm run lint

    - name: Run tests (Strict mode)
      run: npm test
      env:
        NEXT_PUBLIC_SUPABASE_URL: https://test-project.supabase.co
        NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: test-publishable-key-1234567890-not-for-prod
        SUPABASE_SECRET_KEY: test-secret-key-1234567890-not-for-prod

    - name: Test Legacy Fallback (Local/Test mode)
      run: npm test
      env:
        NEXT_PUBLIC_SUPABASE_URL: https://test-project.supabase.co
        NEXT_PUBLIC_SUPABASE_ANON_KEY: test-anon-key-1234567890-not-for-prod
        SUPABASE_SERVICE_ROLE_KEY: test-service-role-key-1234567890-not-for-prod

    - name: Setup Supabase CLI
      uses: supabase/setup-cli@v3
      with:
        version: latest

    - name: Start Supabase
      run: supabase start

    - name: Run Database Tests (pgTAP)
      run: supabase test db

    - name: Run Concurrency Tests
      run: npm run test:concurrency

    - name: Run Append-only Concurrency Tests
      run: npm run test:concurrency:append

    - name: Run HTTP API Tests
      run: npm run test:api

    - name: Run Gateway Tests
      run: npm run test:gateway
