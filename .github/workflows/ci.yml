name: CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-test:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Use Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '22.12.0'
        cache: 'npm'

    - name: Install dependencies
      run: npm ci

    - name: Build project
      run: npm run build
      env:
        NEXT_PUBLIC_SUPABASE_URL: https://test-project.supabase.co
        NEXT_PUBLIC_SUPABASE_ANON_KEY: test-anon-key-1234567890-not-for-prod
        SUPABASE_SERVICE_ROLE_KEY: test-secret-key-1234567890-not-for-prod

    - name: Run linter
      run: npm run lint

    - name: Run tests
      run: npm test
      env:
        NEXT_PUBLIC_SUPABASE_URL: https://test-project.supabase.co
        NEXT_PUBLIC_SUPABASE_ANON_KEY: test-anon-key-1234567890-not-for-prod
        SUPABASE_SERVICE_ROLE_KEY: test-secret-key-1234567890-not-for-prod

    - name: Setup Supabase CLI
      uses: supabase/setup-cli@v1
      with:
        version: latest

    - name: Start Supabase
      run: supabase start

    - name: Run Database Tests (pgTAP)
      run: supabase test db

    - name: Run Concurrency Tests
      run: npm run test:concurrency

    - name: Run HTTP API Tests
      run: npm run test:api

    - name: Run Gateway Tests
      run: npm run test:gateway
